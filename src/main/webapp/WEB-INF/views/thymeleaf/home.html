<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dqrka5zry/image/upload/v1782952771/WhatsApp_Image_2026-07-01_at_9.28.32_PM_oplcqj.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>KioNet - Tu Kiosco Virtual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}"/>
    <link rel="stylesheet" th:href="@{/css/componentesYAlertas.css}"/>
    <link rel="stylesheet" th:href="@{/css/home.css}"/>

</head>

<body>
<div class="container-fluid">

    <div th:replace="fragmentos/header :: header"></div>

    <main class="main">
            <div th:replace="fragmentos/panelIzqCliente :: panelCliente"></div>


        <section class="panel-tienda">
            <div class="banner-titulos">
                <div class="banner-titulos-texto">
                    <h1>Bienvenidos a KioNet UNLAM</h1>
                    <h2>Hacé tu pedido hoy, tu hijo retira mañana</h2>
                </div>
            </div>

            <section class="products-section" th:if="${productosBuscados != null || errorBusquedaProductos != null}">
                <h2 class="subtitulos">Resultados de la búsqueda:</h2>
                <p th:if="${errorBusquedaProductos}" th:text="${errorBusquedaProductos}"></p>

                <div class="products-grid" th:unless="${#lists.isEmpty(productosBuscados)}">
                    <div class="product-card" th:each="producto : ${productosBuscados}">
                        <div class="product-image-wrapper">
                            <img th:if="${producto.imagen != null}" th:src="${producto.imagen}" alt="golo">
                            <img th:unless="${producto.imagen != null}"
                                 th:src="'https://res.cloudinary.com/dqrka5zry/image/upload/v1780525780/caramelo_qzcvfy.png'"
                                 alt="golo">
                        </div>

                        <div class="product-info">
                            <h4 th:text="${producto.nombre}"></h4>
                            <p class="product-desc" th:text="${producto.descripcion}"></p>
                            <span class="product-price">$ <th:block th:text="${producto.precio}"></th:block></span>
                        </div>

                        <button
                                type="button"
                                th:data-producto-id="${producto.id}"
                                th:classappend="${
                                    producto.cantidad <= 0 ? 'btn-add-product sin-stock' :
                                    (#lists.contains(idsEnCarrito, producto.id) ? 'btn-add-product agregado' : 'btn-add-product')
                                }"
                                th:text="${
                                    producto.cantidad <= 0 ? '¡No hay stock!' :
                                    (#lists.contains(idsEnCarrito, producto.id) ? '✓ Agregado (Quitar)' : '+ Agregar al carrito')
                                }"
                                th:disabled="${producto.cantidad <= 0}"
                                onclick="alternarCarrito(this)">
                        </button>
                    </div>
                </div>
                <hr class="section-divider">
            </section>

            <div class="seccion-filtrar-contenedor" style="margin-top: 1rem; margin-bottom: 1.5rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <p style="font-size: 1.1rem; font-weight: 700; color: var(--text); margin: 0; white-space: nowrap;">
                        Productos filtrados por categoría
                    </p>
                    <hr style="flex: 1; border: none; border-top: 1.5px solid var(--border); margin: 0; opacity: 0.8;">
                </div>
            </div>

            <nav class="categories-nav">
                <a class="category-chip"
                   th:href="@{/home}"
                   th:classappend="${param.categoria == null} ? 'active' : ''">Todos</a>

                <th:block th:each="categoriaProd : ${categorias}">
                    <a class="category-chip"
                       th:href="@{/home(categoria=${categoriaProd.nombreCategoria})}"
                       th:text="${categoriaProd.nombreCategoria}"
                       th:classappend="${param.categoria != null && param.categoria[0] == categoriaProd.nombreCategoria} ? 'active' : ''"></a>
                </th:block>
            </nav>

            <section class="products-section">
                <h2 class="subtitulos"
                    th:text="${param.categoria != null} ? ${param.categoria} : 'Todos los productos'"></h2>

                <p th:if="${errorCargaProductos}" th:text="${errorCargaProductos}"></p>

                <div class="products-grid">
                    <div class="product-card" th:each="producto : ${productos}">
                        <div class="product-image-wrapper">
                            <img th:if="${producto.imagen != null}" th:src="${producto.imagen}" alt="golo">
                            <img th:unless="${producto.imagen != null}"
                                 th:src="'https://res.cloudinary.com/dqrka5zry/image/upload/v1783997395/producto-default.png'" alt="golo">
                        </div>

                        <div class="product-info">
                            <h4 th:text="${producto.nombre}"></h4>
                            <p class="product-desc" th:text="${producto.descripcion}"></p>
                            <span class="product-price">$ <th:block th:text="${producto.precio}"></th:block></span>
                        </div>
                        <button type="button"
                                th:data-producto-id="${producto.id}"
                                th:classappend="${producto.cantidad <= 0 ? 'btn-add-product sin-stock' :
                                                 (#lists.contains(idsEnCarrito, producto.id) ? 'btn-add-product agregado' : 'btn-add-product')
                                               }"
                                th:text="${ producto.cantidad <= 0 ? '¡No hay stock!' :
                                            (#lists.contains(idsEnCarrito, producto.id) ? '✓ Agregado (Quitar)' : '+ Agregar al carrito')
                                        }"
                                th:disabled="${producto.cantidad <= 0}"
                                onclick="alternarCarrito(this)">
                        </button>
                    </div>
                </div>
            </section>

        </section>
    </main>

</div>
<div id="modalSinHijos" class="modal-overlay" onclick="cerrarModalSinHijos(event)">
    <div class="modal-card-contenedor modal-sin-hijos" onclick="event.stopPropagation()">
        <button class="modal-btn-cerrar" onclick="cerrarModalSinHijosDirecto()">&times;</button>
        <div class="modal-sin-hijos-contenido">
            <h3>No podés agregar productos todavía</h3>
            <p>Para agregar productos al carrito primero necesitás cargar al menos un hijo en el sistema.</p>
            <a href="/spring/vistaHijos" class="btn-ir-a-hijos">Ir a Mis Hijos</a>
        </div>
    </div>
</div>
</body>
<audio id="sonidoAgregar" th:src="@{/sonidos/agregar.mp3}" preload="auto"></audio>
<audio id="sonidoQuitar" th:src="@{/sonidos/quitar.mp3}" preload="auto"></audio>

<script>

    function alternarCarrito(btn) {
        const productoId = btn.dataset.productoId;
        const esAgregado = btn.classList.contains('agregado');

        btn.disabled = true;
        btn.textContent = esAgregado ? 'Quitando...' : 'Agregando...';

        // Decidimos la URL según el estado actual del botón
        const url = esAgregado ? '/spring/carrito/eliminar' : '/spring/carrito/agregar';

        fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'productoId=' + productoId
        })
            .then(res => {
                if (res.status === 409) {
                    return res.text().then(msg => {
                        if (msg === 'SIN_HIJOS') {
                            abrirModalSinHijos();
                        }
                        btn.textContent = '+ Agregar al carrito';
                        return null; // cortamos la cadena, no seguimos al bloque de éxito
                    });
                }
                if (res.ok) {
                    // Buscamos el badge del carrito en el header
                    let badge = document.querySelector('.carrito-badge');

                    if (esAgregado) {
                        // SE QUITÓ EL PRODUCTO
                        btn.textContent = '+ Agregar al carrito';
                        btn.classList.remove('agregado');
                        reproducirSonido('sonidoQuitar');

                        // 🔴 Restamos 1 al globito
                        if (badge) {
                            let cant = parseInt(badge.textContent) - 1;
                            if (cant <= 0) {
                                badge.remove(); // Si llega a 0, hacemos desaparecer el globito
                            } else {
                                badge.textContent = cant;
                            }
                        }
                    } else {
                        // SE AGREGÓ EL PRODUCTO
                        btn.textContent = '✓ Agregado (Quitar)';
                        btn.classList.add('agregado');
                        reproducirSonido('sonidoAgregar');

                        // 🔴 Sumamos 1 al globito (o lo creamos si no existía)
                        if (badge) {
                            badge.textContent = parseInt(badge.textContent) + 1;
                        } else {
                            // Si no existía el globito rojo (carrito vacío), lo creamos e insertamos
                            const btnCarrito = document.querySelector('.btn-carrito');
                            if (btnCarrito) {
                                const nuevoBadge = document.createElement('span');
                                nuevoBadge.className = 'carrito-badge';
                                nuevoBadge.textContent = '1';
                                btnCarrito.appendChild(nuevoBadge);
                            }
                        }
                    }
                } else {
                    btn.textContent = esAgregado ? '✓ Agregado (Quitar)' : '+ Agregar al carrito';
                }
            })
            .catch(() => {
                btn.textContent = esAgregado ? '✓ Agregado (Quitar)' : '+ Agregar al carrito';
            })
            .finally(() => {
                btn.disabled = false;
            });
    }
    function reproducirSonido(id) {
        const audio = document.getElementById(id);
        if (!audio) return;
        audio.currentTime = 0;
        audio.play().catch(() => {
            // El navegador puede bloquear el autoplay hasta que haya interacción del
            // usuario; como esto se dispara por un click, no debería ocurrir, pero lo
            // atajamos igual para que no rompa la consola.
        });
    }
    // --- Funciones del modal "Sin hijos" ---
    function abrirModalSinHijos() {
        document.getElementById('modalSinHijos').classList.add('active');
    }

    function cerrarModalSinHijos(e) {
        if (e.target.id === 'modalSinHijos') {
            cerrarModalSinHijosDirecto();
        }
    }

    function cerrarModalSinHijosDirecto() {
        document.getElementById('modalSinHijos').classList.remove('active');
    }
</script>
<script th:src="@{/js/drawer.js}"></script>
</html>
